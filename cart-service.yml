server:
  port: 8084
spring:
  application:
    name: cart-service

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka-service:8010/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Cart Service
    description: Vendora shopping cart microservice
    version: 1.0.0
    
logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"


    
