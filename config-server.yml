spring:
  application:
    name: config-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: Config Service
    description: Vendora shopping config microservice
    version: 1.0.0
    
logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

