server:
  port: 8085
spring:
  application:
    name: order-service

  kafka:
    bootstrap-servers: kafka:29092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: orders-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.vendora.order.dto.PaymentEvent
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

      micrometer:
        enabled: true 

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka-service:8010/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Order Service
    description: Vendora shopping order microservice
    version: 1.0.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

resilience4j:
  circuitbreaker:
    instances:
      CartFeignClientgetCartByCustomerIdLong:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"
          
      ProductFeignClientgetProductsByIdsList:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"

      InventoryFeignClientgetListOfInventoryByProductIdsList:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"
          
      InventoryFeignClientreserveStockForOrderList:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"

      InventoryFeignClientconfirmStockReservationsLong:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"
          
      InventoryFeignClientreleaseReservationsLong:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"

      PaymentFeignClientcreatePaymentPaymentDto:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - "feign.FeignException$NotFound"
          
  timelimiter:
    instances:
      CartFeignClientgetCartByCustomerIdLong:
        timeoutDuration: 5s

      ProductFeignClientgetProductsByIdsList:
        timeoutDuration: 5s

      InventoryFeignClientgetListOfInventoryByProductIdsList:
        timeoutDuration: 5s

      InventoryFeignClientreserveStockForOrderList:
        timeoutDuration: 5s

      InventoryFeignClientconfirmStockReservationsLong:
        timeoutDuration: 5s

      InventoryFeignClientreleaseReservationsLong:
        timeoutDuration: 5s

      PaymentFeignClientcreatePaymentPaymentDto:
        timeoutDuration: 5s

  retry:
    instances:
      cartRetry:
        max-attempts: 3
        wait-duration: 1s

      productRetry:
        max-attempts: 3
        wait-duration: 1s
        
      inventoryGetListRetry:
        max-attempts: 3
        wait-duration: 1s

      reservationReservationsWithRetry:
        max-attempts: 3
        wait-duration: 1s

      releaseReservationsWithRetry:
        max-attempts: 3
        wait-duration: 1s

      confirmReservationsWithRetry:
        max-attempts: 3
        wait-duration: 1s

      paymentRetry:
        max-attempts: 3
        wait-duration: 1s




        
